name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # Copies made with the Deploy to Cloudflare button get this workflow too;
    # only the original repository publishes to GitHub Pages.
    if: github.repository == 'EMRahman/GameRooms'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test games
        run: npm test

      - name: Prepare game routes
        run: |
          for game in dots_and_boxes fourfold go memory_match northstar iron_routes landlord conquest; do
            cp public/index.html "public/$game.html"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    if: github.repository == 'EMRahman/GameRooms'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
