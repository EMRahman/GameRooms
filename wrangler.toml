name = "gamerooms"
main = "worker/index.js"
compatibility_date = "2026-11-26"
workers_dev = true
keep_vars = true

[assets]
directory = "./public"

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "Budget"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Budget", "GameRoom"]
