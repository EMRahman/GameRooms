<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142931">
  <title>GameRooms</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./vendor/qr.js"></script>
  <script type="module" src="./multiplayer.js"></script>
</head>
<body>
<main>
  <header class="masthead"><a href="./">GameRooms</a><span>Two players</span></header>
  <section class="intro">
    <h1 id="game-title">Choose a game</h1>
    <p id="game-subtitle" hidden></p>
  </section>
  <p id="notice" role="status" hidden></p>
  <section id="lobby" class="entry">
    <label for="name">Display name <small>(optional)</small></label>
    <input id="name" maxlength="20" autocomplete="nickname" placeholder="Player name">
    <div id="entry-actions">
      <form id="create">
        <label for="game">Game</label>
        <select id="game"><option value="dots_and_boxes">Dots and Boxes</option><option value="fourfold">Fourfold</option></select>
        <div id="size-field"><label for="size">Board size</label>
        <select id="size"><option value="4">4 × 4 boxes</option><option value="5">5 × 5 boxes</option><option value="6">6 × 6 boxes</option></select></div>
        <button class="primary">Create room</button>
        <details>
          <summary>Owner key</summary>
          <label class="sr-only" for="owner-key">Owner key</label>
          <input id="owner-key" type="password" autocomplete="off" placeholder="Optional owner key">
        </details>
      </form>
      <form id="join">
        <label for="code">Room code</label>
        <input id="code" required maxlength="5" autocapitalize="characters" autocomplete="off" placeholder="5-character code">
        <button>Join room</button>
      </form>
    </div>
    <form id="invite" hidden><button class="primary">Join game</button></form>
  </section>
  <div id="room" class="layout" hidden>
    <section class="game">
      <div class="room-bar">
        <strong id="room-code"></strong>
        <button id="copy">Copy invite link</button>
        <details id="share"><summary>QR code</summary><div id="qr"></div></details>
      </div>
      <div id="players" class="players"></div>
      <p id="turn" role="status"></p>
      <div id="paper" class="paper" hidden><div id="board" aria-label="Dots and Boxes board" role="group"></div></div>
      <div class="actions">
        <button id="start" class="primary" hidden>Start game</button>
        <button id="leave" hidden>Leave room</button>
        <button id="claim" hidden>Claim host</button>
        <button id="remove" hidden>Remove player</button>
        <button id="reconnect" hidden>Reconnect here</button>
      </div>
      <p class="rules" id="rules"></p>
    </section>
    <details class="chat" id="chat-panel" open>
      <summary id="chat-summary">Room chat</summary>
      <ol id="messages" aria-live="polite"></ol>
      <form id="chat"><label for="message" class="sr-only">Message</label><input id="message" maxlength="280" placeholder="Write a message…" required><button>Send</button></form>
    </details>
  </div>
</main>
</body>
</html>
