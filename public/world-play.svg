<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Friends playing together around the world</title>
  <desc id="desc">A luminous atlas connects three players using a phone, tablet, and laptop.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#101f34"/><stop offset="1" stop-color="#091524"/></linearGradient>
    <linearGradient id="land" x2=".9" y2="1"><stop stop-color="#29475a"/><stop offset="1" stop-color="#193748"/></linearGradient>
    <linearGradient id="screen" x2="1" y2="1"><stop stop-color="#183c4d"/><stop offset="1" stop-color="#102b3c"/></linearGradient>
    <filter id="glow" x="-.5" y="-.5" width="2" height="2"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="mapclip"><ellipse cx="362" cy="176" rx="237" ry="133"/></clipPath>
  </defs>
  <rect width="720" height="360" rx="24" fill="url(#bg)"/>
  <rect x="12" y="12" width="696" height="336" rx="18" fill="none" stroke="#274056" stroke-width="1.2"/>
  <ellipse cx="362" cy="176" rx="237" ry="133" fill="#10283a" stroke="#35566a" stroke-width="1.5"/>
  <!-- visible, restrained atlas graticule over the ocean -->
