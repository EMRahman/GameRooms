    <path d="M112 176h500M125 132q237 37 474 0M125 220q237-37 474 0M362 38v276" stroke-dasharray="2 6"/>
    <ellipse cx="362" cy="176" rx="237" ry="133"/><ellipse cx="362" cy="176" rx="158" ry="133"/><ellipse cx="362" cy="176" rx="78" ry="133"/>
  </g>
