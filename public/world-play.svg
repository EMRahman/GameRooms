  <g transform="translate(601 126)">
    <circle cx="31" cy="30" r="31" fill="#142b3b" stroke="#4e7181" stroke-width="1.5"/>
    <path d="M10 59q2-20 21-20t21 20" fill="#628da0"/>
    <path d="M18 28q-4-19 12-23 17-4 20 14l-4 10-4-11-13-4-8 13Z" fill="#171f2c"/>
    <ellipse cx="30" cy="28" rx="12" ry="15" fill="#e1b58d"/>
