    <path class="route" d="M186 105 Q352 58 548 160" stroke-width="2.5" opacity=".82" style="animation-delay:-1.7s"/>
    <path d="M548 160 Q449 212 378 202 Q270 207 186 105" stroke-width="1.7" stroke-dasharray="5 7" opacity=".52"/>
  </g>
