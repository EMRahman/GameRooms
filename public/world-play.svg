    <path d="m222 145 13 1 9 10 14 5 5 10-7 10-10-2-6-11-12-5Z"/>
    <path d="m251 184 17 6 13 12 8 16-2 16-8 9-2 18-8-5-5-20-7-11-3-17-10-8Z"/>
