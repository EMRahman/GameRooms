    <circle cx="36" cy="27" r="27" fill="#142b3b" stroke="#4e7181" stroke-width="1.5"/>
    <path d="M16 50q3-17 20-17t20 17" fill="#c8a85f"/>
    <path d="M21 24q-1-17 15-18 15 1 16 16l-5 5-5-11-14-1-7 11Z" fill="#614334"/>
    <ellipse cx="36" cy="24" rx="11" ry="13" fill="#9c6449"/>
    <path d="M26 20q5-11 18-7l8 8-2-10-11-7-13 6-4 9Z" fill="#614334"/>
    <g fill="none" stroke="#263344" stroke-width="1.7"><rect x="27" y="20" width="8" height="6" rx="2"/><rect x="38" y="20" width="8" height="6" rx="2"/><path d="M35 22h3"/></g>
    <path d="M33 31q3 2 6 0" fill="none" stroke="#704237" stroke-width="1.3" stroke-linecap="round"/>
    <g transform="translate(2 48)"><path d="M5 0h58l5 28H0Z" fill="#dcebe7"/><path d="M8 3h52l3 21H4Z" fill="url(#screen)"/><path d="M-4 29h76l-7 5H3Z" fill="#9bb9bb"/><path d="M25 29h20" stroke="#708f95" stroke-width="1.3"/><g fill="#71e3c1"><rect x="16" y="8" width="9" height="7" rx="1.5"/><rect x="27" y="8" width="9" height="7" rx="1.5" opacity=".62"/><rect x="38" y="8" width="9" height="7" rx="1.5"/><rect x="27" y="17" width="9" height="5" rx="1.2"/><rect x="49" y="17" width="8" height="5" rx="1.2" opacity=".62"/></g><path d="M25 11h3m8 9h13" stroke="#9bf2d5" stroke-width="1"/></g>
  </g>
  <!-- tiny orbiting stars -->
  <g fill="#a0b9c1" opacity=".8"><circle cx="93" cy="65" r="1.5"/><circle cx="626" cy="85" r="1.5"/><circle cx="580" cy="275" r="1.3"/><circle cx="132" cy="278" r="1.2"/><path d="M96 227v7m-3.5-3.5h7M590 60v6m-3-3h6" stroke="#a0b9c1" stroke-width="1"/></g>
  <style>
    .route { animation: route-glow 3.8s ease-in-out infinite alternate; }
    @keyframes route-glow { to { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
