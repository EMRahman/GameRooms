    <g transform="translate(52 39) rotate(8)"><rect width="23" height="37" rx="5" fill="#dcebe7"/><rect x="2.5" y="3" width="18" height="29" rx="2.5" fill="url(#screen)"/><circle cx="11.5" cy="34" r="1.2" fill="#66818a"/><g fill="#71e3c1"><rect x="5" y="9" width="5" height="5" rx="1"/><rect x="12" y="9" width="5" height="5" rx="1" opacity=".65"/><rect x="12" y="16" width="5" height="5" rx="1"/><rect x="5" y="23" width="5" height="5" rx="1" opacity=".65"/></g><path d="M10 12h2m0 7v5" stroke="#9bf2d5" stroke-width="1.2"/></g>
  </g>
