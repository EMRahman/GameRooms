    <path d="m354 143 12-10 13-2 11 7 10-2 10 7-1 13-9 9-5 20-10 17-4 21-9 5-8-13-2-17-8-10-3-19-7-11Z"/>
    <path d="m423 102 11 5 8 12-5 13-11-6-7-13Z"/>
    <path d="m474 185 18-7 18 7 14 14-8 13-19-5-14-10Z"/>
    <path d="m526 221 10-6 9 7-4 12-11 1Z"/>
    <path d="m327 73 9-7 8 4-4 10Z"/>
